<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KADOSK Admin — Gift Cards</title>
<link rel="stylesheet" href="assets/admin-style.css" />
</head>
<body>
  <div class="adm-app">
    <aside class="adm-sidebar" id="admSidebar"></aside>
    <main class="adm-main">
      <div class="adm-entete">
        <h1>Gift Cards</h1>
        <span class="adm-badge-role" id="admBadgeRole">—</span>
      </div>
      <div class="adm-panneau">
        <div class="adm-toolbar">
          <select class="adm-select" id="selectStatut">
            <option value="">Tous les statuts</option>
            <option value="ACTIVE">Disponibles</option>
            <option value="REDEEMED">Utilisées</option>
            <option value="EXPIRED">Expirées</option>
            <option value="SUSPENDED">Suspendues</option>
            <option value="CANCELLED">Annulées</option>
          </select>
          <button class="adm-bouton secondaire" id="boutonFiltrer">Filtrer</button>
        </div>
        <div id="conteneurListe"><div class="adm-vide">Chargement…</div></div>
      </div>
    </main>
  </div>

  <!-- Modale de confirmation - raison toujours obligatoire (section 16.3 de
       l'audit) avant toute suspension/annulation/réactivation de carte. -->
  <div class="adm-modal-fond" id="modalFond" style="display:none;">
    <div class="adm-modal">
      <h3 id="modalTitre">Confirmer l'action</h3>
      <textarea id="modalRaison" placeholder="Raison (obligatoire)..."></textarea>
      <div class="adm-message-erreur" id="modalErreur"></div>
      <div class="adm-modal-actions">
        <button class="adm-bouton secondaire" id="modalAnnuler">Annuler</button>
        <button class="adm-bouton" id="modalConfirmer">Confirmer</button>
      </div>
    </div>
  </div>

  <script src="assets/config.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/admin-nav.js"></script>
  <script src="assets/admin-guard.js"></script>
  <script src="assets/admin-giftcards.js"></script>
</body>
</html>
