<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KADOSK Marchand — Mot de passe oublié</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="kadosk-page-connexion">
    <div class="kadosk-carte-connexion">
      <img src="assets/logo.png" alt="KADOSK" style="height:34px; display:block; margin-bottom:22px;" />

      <div id="etapeEmail">
        <p style="font-size:13px; color:var(--kadosk-texte-clair); margin:0 0 18px;">Indiquez votre email et le nouveau mot de passe souhaité. Un code de confirmation vous sera envoyé par email.</p>

        <div class="kadosk-champ">
          <label for="champEmail">Email</label>
          <input type="email" id="champEmail" autocomplete="username" />
        </div>

        <div class="kadosk-champ">
          <label for="champNouveauMdp">Nouveau mot de passe</label>
          <input type="password" id="champNouveauMdp" autocomplete="new-password" />
        </div>

        <div class="kadosk-champ">
          <label for="champConfirmationMdp">Confirmer le mot de passe</label>
          <input type="password" id="champConfirmationMdp" autocomplete="new-password" />
        </div>

        <button class="kadosk-bouton" id="boutonEnvoyerCode" style="width:100%;">Envoyer le code</button>
        <div class="kadosk-message-erreur" id="messageErreurEmail"></div>
      </div>

      <div id="etapeCode" style="display:none;">
        <p style="font-size:13px; color:var(--kadosk-texte-clair); margin:0 0 18px;">Saisissez le code à 6 chiffres reçu par email.</p>

        <div class="kadosk-champ">
          <label for="champCode">Code de vérification</label>
          <input type="text" id="champCode" inputmode="numeric" maxlength="6" placeholder="000000" />
        </div>

        <button class="kadosk-bouton" id="boutonConfirmerCode" style="width:100%;">Confirmer et se connecter</button>
        <div class="kadosk-message-erreur" id="messageErreurCode"></div>
      </div>

      <p style="text-align:center; margin-top:18px;">
        <a href="login.html" style="color:var(--kadosk-violet); font-weight:700; font-size:13px;">Retour à la connexion</a>
      </p>
    </div>
  </div>

  <script src="assets/config.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/api.js"></script>
  <script>
    const CLE_CODE_REINIT = "kadosk_reset_code_en_attente";

    const etapeEmail = document.getElementById("etapeEmail");
    const etapeCode = document.getElementById("etapeCode");
    const champEmail = document.getElementById("champEmail");
    const champNouveauMdp = document.getElementById("champNouveauMdp");
    const champConfirmationMdp = document.getElementById("champConfirmationMdp");
    const champCode = document.getElementById("champCode");
    const boutonEnvoyerCode = document.getElementById("boutonEnvoyerCode");
    const boutonConfirmerCode = document.getElementById("boutonConfirmerCode");
    const messageErreurEmail = document.getElementById("messageErreurEmail");
    const messageErreurCode = document.getElementById("messageErreurCode");

    if (KADOSK_AUTH.estConnecte()) {
      window.location.href = "dashboard.html";
    }

    async function envoyerCode() {
      messageErreurEmail.textContent = "";
      const email = champEmail.value.trim();
      const motDePasse = champNouveauMdp.value;
      const confirmation = champConfirmationMdp.value;

      if (!email) {
        messageErreurEmail.textContent = "Merci d'indiquer votre email.";
        return;
      }
      if (!motDePasse || motDePasse.length < 8) {
        messageErreurEmail.textContent = "Le mot de passe doit contenir au moins 8 caractères.";
        return;
      }
      if (motDePasse !== confirmation) {
        messageErreurEmail.textContent = "Les mots de passe ne correspondent pas.";
        return;
      }

      boutonEnvoyerCode.disabled = true;
      boutonEnvoyerCode.textContent = "Envoi en cours...";

      try {
        await KADOSK_API.forgotPassword(email, motDePasse);
        etapeEmail.style.display = "none";
        etapeCode.style.display = "block";
        champCode.focus();
      } catch (erreur) {
        console.error("Erreur demande réinitialisation :", erreur);
        messageErreurEmail.textContent = "Une erreur est survenue. Merci de réessayer.";
      } finally {
        boutonEnvoyerCode.disabled = false;
        boutonEnvoyerCode.textContent = "Envoyer le code";
      }
    }

    async function confirmerCode() {
      messageErreurCode.textContent = "";
      const email = champEmail.value.trim();
      const code = champCode.value.trim();

      if (!code) {
        messageErreurCode.textContent = "Merci de saisir le code reçu par email.";
        return;
      }

      boutonConfirmerCode.disabled = true;
      boutonConfirmerCode.textContent = "Vérification...";

      try {
        const resultat = await KADOSK_API.confirmForgotPassword(email, code);
        if (!resultat || !resultat.sessionToken) {
          throw new Error("CODE_INVALIDE");
        }
        sessionStorage.setItem(CLE_CODE_REINIT, code);
        await KADOSK_AUTH.demarrerAutorisationMembre(resultat.sessionToken);
      } catch (erreur) {
        console.error("Erreur confirmation code :", erreur);
        messageErreurCode.textContent = "Code invalide ou expiré. Merci de réessayer.";
        boutonConfirmerCode.disabled = false;
        boutonConfirmerCode.textContent = "Confirmer et se connecter";
      }
    }

    boutonEnvoyerCode.addEventListener("click", envoyerCode);
    boutonConfirmerCode.addEventListener("click", confirmerCode);
    champConfirmationMdp.addEventListener("keydown", (e) => { if (e.key === "Enter") envoyerCode(); });
    champCode.addEventListener("keydown", (e) => { if (e.key === "Enter") confirmerCode(); });
  </script>
</body>
</html>
