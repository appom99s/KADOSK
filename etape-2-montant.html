<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Étape 2 · Montant par carte — KADOSK</title>
<link rel="stylesheet" href="assets/kadosk2.css" />
</head>
<body class="k2-body">
  <div class="k2-topbar">
    <a href="accueil.html" class="k2-logo">
      <img src="assets/logo.png" alt="KADOSK" />
    </a>
    <a href="boutique.html" class="k2-topbar-panier" title="Mon panier">🛒<span class="k2-topbar-panier-badge" data-panier-badge style="display:none">0</span></a>
  </div>

  <main class="k2-main" style="max-width:640px;">
    <p class="k2-titre">ÉTAPE 2</p>
    <h1 class="k2-sous-titre">Montant par carte</h1>

    <div class="k2-stepper">
      <div class="k2-step k2-step-done"><span class="k2-step-numero">1</span><span>Choix</span></div>
      <div class="k2-step-trait"></div>
      <div class="k2-step k2-step-active"><span class="k2-step-numero">2</span><span>Montant</span></div>
      <div class="k2-step-trait"></div>
      <div class="k2-step"><span class="k2-step-numero">3</span><span>Récapitulatif</span></div>
      <div class="k2-step-trait"></div>
      <div class="k2-step"><span class="k2-step-numero">4</span><span>Destinataire &amp; Message</span></div>
      <div class="k2-step-trait"></div>
      <div class="k2-step"><span class="k2-step-numero">5</span><span>Confirmation</span></div>
    </div>

    <div class="k2-carte">
      <div class="k2-champ" style="margin-bottom:4px;">
        <label>Définissez le montant pour chaque carte</label>
        <p style="font-size:12.5px;color:var(--k2-texte-clair);margin:0 0 6px;">Vous pouvez modifier ou supprimer une carte.</p>
      </div>

      <div id="etatVide" class="k2-etat" style="display:none">
        Votre sélection est vide. <a href="boutique.html" style="color:var(--k2-primary);font-weight:700;">Choisir des cartes</a>
      </div>

      <div id="listeLignes"></div>

      <button type="button" class="k2-btn k2-btn-secondaire" id="btnAjouterCarte" style="width:100%; margin-top:8px;">
        <span id="k2IconePlus"></span> Ajouter une autre carte
      </button>

      <div class="k2-total-bloc">
        <span id="texteNombreCartes">0 carte(s)</span>
        <span>Total <span class="valeur" id="texteTotal">0,00 DH</span></span>
      </div>

      <div class="k2-ligne-boutons-nav">
        <button type="button" class="k2-btn k2-btn-secondaire" id="btnRetour">
          <span id="k2IconeRetour"></span> Retour
        </button>
        <button type="button" class="k2-btn k2-btn-primaire" id="btnContinuer" disabled>
          Continuer <span id="k2IconeContinuer"></span>
        </button>
      </div>

      <div class="k2-securite">
        <span id="k2IconeSecurite"></span>
        <span>Paiement 100% sécurisé — vos données sont protégées et cryptées.</span>
      </div>
    </div>
  </main>

  <div id="k2NavBas" class="k2-bottom-nav"></div>

  <script src="assets/config.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/icons.js"></script>
  <script src="assets/nav2.js"></script>
  <script src="assets/panier2.js"></script>
  <script src="assets/etape2.js"></script>
</body>
</html>
