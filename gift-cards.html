<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KADOSK Marchand — Cartes cadeaux</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="kadosk-app">
    <aside class="kadosk-sidebar" id="kadoskSidebar"></aside>

    <main class="kadosk-main">
      <div class="kadosk-entete">
        <h1>Cartes cadeaux</h1>
        <div id="kadoskEnteteDroite" class="kadosk-entete-droite"></div>
      </div>

      <div class="kadosk-filtres">
        <span class="kadosk-filtre actif" data-filtre="ALL">Toutes</span>
        <span class="kadosk-filtre" data-filtre="ACTIVE">Actives</span>
        <span class="kadosk-filtre" data-filtre="USED">Utilisées</span>
        <span class="kadosk-filtre" data-filtre="EXPIRED">Expirées</span>
      </div>

      <div class="kadosk-panneau-large">
        <table class="kadosk-table">
          <thead>
            <tr>
              <th>Carte</th>
              <th>Client</th>
              <th>Créée le</th>
              <th>Solde initial</th>
              <th>Solde restant</th>
              <th>Statut</th>
            </tr>
          </thead>
          <tbody id="corpsTableCartes"></tbody>
        </table>
        <div class="kadosk-liste-vide" id="etatVideCartes" style="display:none;">Aucune carte pour ce filtre.</div>
      </div>
    </main>
  </div>

  <script src="assets/config.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/nav.js"></script>
  <script src="assets/guard.js"></script>
  <script src="assets/gift-cards.js"></script>
</body>
</html>
