<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KADOSK Marchand — Connexion</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="kadosk-page-connexion">
    <div class="kadosk-carte-connexion">
      <div class="kadosk-logo">KADOSK</div>
      <div class="kadosk-slogan">LE CADEAU, SIMPLEMENT</div>

      <div class="kadosk-champ">
        <label for="champEmail">Email</label>
        <input type="email" id="champEmail" autocomplete="username" />
      </div>

      <div class="kadosk-champ">
        <label for="champMotDePasse">Mot de passe</label>
        <input type="password" id="champMotDePasse" autocomplete="current-password" />
      </div>

      <button class="kadosk-bouton" id="boutonConnexion">Se connecter</button>

      <div class="kadosk-message-erreur" id="messageErreur"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    const boutonConnexion = document.getElementById("boutonConnexion");
    const champEmail = document.getElementById("champEmail");
    const champMotDePasse = document.getElementById("champMotDePasse");
    const messageErreur = document.getElementById("messageErreur");

    if (KADOSK_AUTH.estConnecte()) {
      window.location.href = "dashboard.html";
    }

    async function tenterConnexion() {
      messageErreur.textContent = "";
      const email = champEmail.value.trim();
      const motDePasse = champMotDePasse.value;

      if (!email || !motDePasse) {
        messageErreur.textContent = "Merci de renseigner votre email et votre mot de passe.";
        return;
      }

      boutonConnexion.disabled = true;
      boutonConnexion.textContent = "Connexion en cours...";

      try {
        const resultat = await KADOSK_AUTH.loginMembre(email, motDePasse);

        if (resultat.state === "SUCCESS") {
          await KADOSK_AUTH.demarrerAutorisationMembre(resultat.sessionToken);
          return;
        }

        if (resultat.state === "REQUIRE_OWNER_APPROVAL") {
          messageErreur.textContent = "Votre compte marchand est en attente d'approbation.";
        } else if (resultat.state === "REQUIRE_EMAIL_VERIFICATION") {
          messageErreur.textContent = "Merci de vérifier votre adresse email avant de continuer.";
        } else {
          messageErreur.textContent = "Connexion impossible. Vérifiez vos identifiants.";
        }
      } catch (erreur) {
        messageErreur.textContent = "Email ou mot de passe incorrect.";
      } finally {
        boutonConnexion.disabled = false;
        boutonConnexion.textContent = "Se connecter";
      }
    }

    boutonConnexion.addEventListener("click", tenterConnexion);
    champMotDePasse.addEventListener("keydown", (evenement) => {
      if (evenement.key === "Enter") tenterConnexion();
    });
  </script>
</body>
</html>
