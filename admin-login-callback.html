<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KADOSK Admin — Connexion en cours</title>
<link rel="stylesheet" href="assets/admin-style.css" />
</head>
<body>
  <div class="adm-page-connexion">
    <div class="adm-carte-connexion" style="text-align:center;">
      <div class="adm-sidebar-titre" style="color:var(--adm-dark); padding-bottom:14px; justify-content:center;">KAD<span style="color:var(--adm-primary);">OSK</span> · Admin</div>
      <div id="messageStatut" style="font-size:13.5px; color:var(--adm-texte-clair);">Connexion en cours...</div>
    </div>
  </div>

  <script src="assets/config.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/api.js"></script>
  <script>
    const ADMIN_LOGIN_CALLBACK_PATH = "/admin-login-callback.html";
    const messageStatut = document.getElementById("messageStatut");

    (async function () {
      try {
        await KADOSK_AUTH.traiterRetourAutorisation(ADMIN_LOGIN_CALLBACK_PATH);

        // Vérifie tout de suite que ce membre Wix a bien une entrée AdminUsers
        // côté serveur - une connexion Wix Member réussie ne suffit pas : voir
        // adminSecurity.web.js :: obtenirAdminConfirme. Si ce n'est pas le cas,
        // on déconnecte immédiatement plutôt que de laisser un marchand ou
        // acheteur connecté accéder par erreur à une page admin-*.html.
        await KADOSK_API.getAdminDashboard();
        window.location.href = "admin-dashboard.html";
      } catch (erreur) {
        console.error("Erreur callback Admin KADOSK :", erreur);
        if (erreur && erreur.message === "NOT_ADMIN") {
          messageStatut.textContent = "Ce compte n'a pas accès à l'espace Admin.";
          // Efface la session Wix Member ouverte par erreur pour cet espace -
          // sinon admin-login.html la verrait "connectée" et renverrait en
          // boucle vers cette page (KADOSK_AUTH.deconnecter() n'est pas utilisé
          // ici : il redirige vers le logout marchand, pas admin-login.html).
          try {
            localStorage.removeItem("kadosk_member_tokens");
          } catch (erreurStockage) {}
        } else {
          messageStatut.textContent = "La connexion a échoué. Merci de réessayer.";
        }
        KADOSK_AUTH.effacerVerification2FA();
        setTimeout(() => {
          window.location.href = "admin-login.html";
        }, 2500);
      }
    })();
  </script>
</body>
</html>
